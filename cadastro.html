<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="CSS/cadastro.css">
    <script src="JS/index.js"></script>
</head>

<body>
    <h1>
        Junte-se a nós
    </h1>
</body>
<form action="/enviar-cadastro" method="POST">
        
        <!-- Agrupamento de Identificação Pessoal -->
        <fieldset>
            <legend>Dados Pessoais</legend>
            
            <div>
                <label for="nome">Nome completo:*</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
            </div>

            <div>
                <label for="email">E-mail:*</label>
                <input type="email" id="email" name="email" required placeholder="seuemail@dominio.com">
            </div>

            <div>
                <label for="data_nascimento">Data de Nascimento:*</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required>
            </div>
            
            <div>
                <label for="telefone">Telefone / Celular:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>
        </fieldset>

        <!-- Agrupamento de Localização -->
        <fieldset>
            <legend>Endereço</legend>
            
            <div>
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" placeholder="00000-000" pattern="[0-9]{5}-[0-9]{3}">
            </div>

            <div>
                <label for="endereco">Endereço (Rua, Nº, Bairro):</label>
                <input type="text" id="endereco" name="endereco" placeholder="Rua Exemplo, 123 - Bairro">
            </div>

            <div>
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" placeholder="Sua cidade">
            </div>

            <div>
                <label for="estado">Estado (UF):</label>
                <select id="estado" name="estado">
                    <option value="">Selecione...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>
        </fieldset>

        <!-- Agrupamento de Segurança -->
        <fieldset>
            <legend>Dados de Acesso</legend>

            <div>
                <label for="senha">Senha:*</label>
                <input type="password" id="senha" name="senha" required minlength="8">
            </div>

            <div>
                <label for="confirma_senha">Confirmar Senha:*</label>
                <input type="password" id="confirma_senha" name="confirma_senha" required minlength="8">
            </div>
        </fieldset>

        <br>
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>

    </form>
</html>
